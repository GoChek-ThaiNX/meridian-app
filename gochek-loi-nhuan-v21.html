  .login .u{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:9px;cursor:pointer}

  .login .u b{font-size:14px} .login .u small{color:var(--tx2);font-size:12px}
  .login .u .role{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EEF0F5;color:var(--tx2)}

  .modal.wide{max-width:960px}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}

  .rpt-tbl td{padding:7px 10px} .rpt-tbl .sub td{color:var(--tx2);font-size:13px}
</style>

  const ny=mo===12?y+1:y,nm=mo===12?1:mo+1;return ny+'-'+String(nm).padStart(2,'0');};

function mergeImpact(old,neu){

  return Object.values(m).filter(x=>Math.abs(x.delta)>0.5);}

function vAliases(ch,v,vk){

  if(code&&normSku(code))out.push('sku:'+normSku(code));

function guessCombo(sku,name,allSkus){
  const src=String(sku||'').includes('+')?String(sku):String(name||'');
  if(!/\+/.test(src))return null;
  const parts=src.split('+').map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)return null;
  // ứng viên: bỏ chính nó và bỏ các mã cũng là combo
  const cand=allSkus.filter(x=>x!==sku&&!String(x).includes('+'));
  return parts.map(pt=>{const k=skuKey(pt);
    let hit=cand.find(x=>skuKey(x)===k);
    if(!hit){const m=cand.filter(x=>skuKey(x).length>=4&&k.includes(skuKey(x)));
      m.sort((a,b)=>skuKey(b).length-skuKey(a).length);hit=m[0];}
    if(!hit){const m=cand.filter(x=>k.length>=4&&skuKey(x).includes(k));
      m.sort((a,b)=>skuKey(a).length-skuKey(b).length);hit=m[0];}
    return {raw:pt,sku:hit||'',qty:1};});}

  header.forEach(h=>{if(!h)return;const n=norm(h);let s=-1;
    kws.forEach((k,i)=>{if(n===k)s=Math.max(s,100-i);else if(n.includes(k))s=Math.max(s,60-i);});
    if(s>bs){bs=s;best=h;}});
  return bs>0?best:'';
}

  if(cRev.length){score.order+=3;why.order.push('cột tiền "'+cRev[0]+'"');}
  if(cQty.length){score.order+=1;score.stock+=1;why.order.push('cột "'+cQty[0]+'"');}
  if(cTon.length){score.stock+=5;why.stock.push('cột "'+cTon[0]+'"');}
  if(cSku.length&&!cOrder.length){score.stock+=2;why.stock.push('cột "'+cSku[0]+'"');}

  channels:DEF_CHANNELS.map(x=>({...x})),cats:DEF_CATS.map(x=>({...x})),users:DEF_USERS,
  products:DEF_PRODUCTS.map(p=>({...p,cost:{...p.cost},price:{}})),rates:{},skuMap:{},catMap:{},colMap:{},costHint:{},combos:{},logs:[],bankAccounts:{},
  entries:{},stock:{},orderIds:{}};}

/* ===== TÍNH TOÁN ===== */
const rateFor=(st,mid,m)=>(st.rates[mid]&&st.rates[mid][m]!=null)?st.rates[mid][m]:((st.markets.find(x=>x.id===mid)||{}).rate||1);
function costOf(st,pid,mid,depth){
  depth=depth||0;const p=st.products.find(x=>x.id===pid);if(!p)return 0;
  if(p.cost&&p.cost[mid])return p.cost[mid];
  if(p.kind==='combo'&&Array.isArray(p.components)&&depth<4){
    let sum=0;p.components.forEach(c=>{const cp=st.products.find(x=>x.sku===c.sku);
      if(cp)sum+=(c.qty||1)*costOf(st,cp.id,mid,depth+1);});
    return sum;}
  return 0;}
function priceOf(st,pid,mid,depth){
  depth=depth||0;const p=st.products.find(x=>x.id===pid);if(!p)return 0;
  if(p.price&&p.price[mid])return p.price[mid];
  if(p.kind==='combo'&&Array.isArray(p.components)&&depth<4){
    let sum=0;p.components.forEach(c=>{const cp=st.products.find(x=>x.sku===c.sku);
      if(cp)sum+=(c.qty||1)*priceOf(st,cp.id,mid,depth+1);});
    return sum;}
  return 0;}
const priceBySku=(st,sku,mid)=>{const p=st.products.find(x=>x.sku===sku);return p?priceOf(st,p.id,mid):0;};
const costBySku=(st,sku,mid)=>{const p=st.products.find(x=>x.sku===sku);return p?costOf(st,p.id,mid):0;};
function compCOGS(st,e,mid){if(!e)return{cogs:0,mapped:0,total:0,direct:0};
  const dc=e.cogsCh||{};const direct=Object.values(dc).reduce((a,b)=>a+b,0);
  const V=e.variants||{};let c=0,m=0,t=0;
  Object.keys(V).forEach(ch=>{if(dc[ch]!==undefined)return;   // kênh đã có giá vốn thẳng từ file
    Object.keys(V[ch]).forEach(k=>{const v=V[ch][k],pid=resolveSku(st,ch,v,k);
      t+=v.qty;if(pid){m+=v.qty;c+=v.qty*costOf(st,pid,mid);}});});
  return {cogs:c+direct,mapped:m,total:t,direct};}
// doanh thu niêm yết = số lượng bán × giá niêm yết đã cấu hình
function compListRev(st,e,mid){
  const V=(e&&e.variants)||{};const byCh={};let total=0,mq=0,tq=0;
  Object.keys(V).forEach(ch=>{let sum=0,q=0,mm=0;
    Object.keys(V[ch]).forEach(k=>{const v=V[ch][k];q+=v.qty||0;
      const pid=resolveSku(st,ch,v,k);const pr=pid?priceOf(st,pid,mid):0;
      if(pr){sum+=(v.qty||0)*pr;mm+=v.qty||0;}});
    if(q){byCh[ch]={list:sum,qty:q,mapped:mm};total+=sum;mq+=mm;tq+=q;}});
  return {byCh,total,mapped:mq,qty:tq,cov:tq?mq/tq:0,has:total>0};}
function stockValue(st,coId,mid,month){const raw=st.stock[coId+'|'+month];if(!raw)return null;
  const combos=st.combos||{};
  const qmap={};let dropped=0,droppedQty=0,exploded=0;
  Object.keys(raw).forEach(sku=>{
    const row=typeof raw[sku]==='object'?raw[sku]:{qty:raw[sku]};
    const cb=combos[sku];
    if(cb&&cb.mode==='virtual'){dropped++;droppedQty+=row.qty||0;return;}
    if(cb&&cb.mode==='explode'){exploded++;
      (cb.components||[]).forEach(c=>{if(!c.sku)return;
        qmap[c.sku]=qmap[c.sku]||{qty:0,name:'',viaCombo:0};
        const add=(row.qty||0)*(c.qty||1);qmap[c.sku].qty+=add;qmap[c.sku].viaCombo+=add;});
      return;}
    qmap[sku]=qmap[sku]||{qty:0,name:row.name||'',viaCombo:0};
    qmap[sku].qty+=row.qty||0;if(row.name&&!qmap[sku].name)qmap[sku].name=row.name;});
  let v=0;const items=[];
  Object.keys(qmap).forEach(sku=>{const row=qmap[sku];
    const p=st.products.find(p=>p.sku===sku);const hint=(st.costHint||{})[sku];
    const c=p?costOf(st,p.id,mid):(hint||0);const val=(row.qty||0)*c;v+=val;
    items.push({sku,name:p?p.name:(row.name||'(chưa có trong danh mục)'),qty:row.qty||0,cost:c,val,
      known:!!p,fromHint:!p&&!!hint,viaCombo:row.viaCombo||0,isCombo:!!(combos[sku]&&combos[sku].mode==='keep')});});
  items.sort((a,b)=>b.val-a.val);
  return {total:v,items,dropped,droppedQty,exploded};}
function invBE(st,coId,mid,month){const e=stockValue(st,coId,mid,month),pm=prevMonth(month);
  const b=pm?stockValue(st,coId,mid,pm):null;return {begin:b?b.total:0,end:e?e.total:0,hasEnd:!!e,hasBegin:!!b};}
/* --- BÊN HOẠT ĐỘNG KINH DOANH (KQKD) --- */
function compPnL(st,e,mid,month){if(!e)return null;
  let net=0;Object.keys(e.revenue||{}).forEach(ch=>{const r=e.revenue[ch];net+=(r.gross||0)-(r.refund||0);});
  const C=compCOGS(st,e,mid),cogs=C.cogs,gross=net-cogs;const byGroup={};let opexTotal=0;
  st.cats.forEach(c=>{const o=e.opex&&e.opex[c.id];if(!o)return;let a=o.amount||0;
    if(o.ccy==='₫'&&CCY[mid]!=='₫')a=a/rateFor(st,mid,month);
    byGroup[c.group]=(byGroup[c.group]||0)+a;opexTotal+=a;});
  return {net,cogs,gross,byGroup,opexTotal,profit:gross-opexTotal,cov:C.total?C.mapped/C.total:1,hasData:net>0||opexTotal>0||cogs>0};}
/* Gộp chi phí: phí sàn (từ Finance, theo e.feeCh) + chi phí nhập tay (e.opexManual) -> e.opex.
   Không ghi đè: cùng một danh mục đến từ 2 nguồn sẽ CỘNG DỒN. Chỉ đụng các danh mục có mặt ở feeCh hoặc opexManual. */
function syncOpex(e,ccy,rate){
  const feeKeys=['phisan','phitt','vc','aff','qc','vat'];
  const fin={};feeKeys.forEach(k=>{let s=0;Object.values(e.feeCh||{}).forEach(f=>s+=(f&&f[k])||0);if(s)fin[k]=s;});
  const man=e.opexManual||{};e.opex=e.opex||{};
  const touch=new Set([...Object.keys(fin),...Object.keys(man)]);
  touch.forEach(k=>{const f=fin[k]||0,mE=man[k];
    if(mE&&(mE.amount||0)){const mAmt=mE.amount||0;
      if(f){const mMkt=(mE.ccy==='₫'&&ccy!=='₫')?mAmt/(rate||1):mAmt;e.opex[k]={amount:f+mMkt,ccy};}
      else e.opex[k]={amount:mAmt,ccy:mE.ccy||ccy};}
    else if(f)e.opex[k]={amount:f,ccy};
    else delete e.opex[k];});}
/* --- BÊN DÒNG TIỀN (độc lập, nhập tay) --- */
const sumL=(a,f)=>(a||[]).reduce((s,x)=>s+(f?f(x):(x.amount||0)),0);
// số dư đầu kỳ = số dư cuối kỳ của kỳ trước (khớp theo mã dòng, rồi tới tên)
function prevCash(st,coId,month){const pm=prevMonth(month);if(!pm)return null;
  const pe=st.entries[coId+'|'+pm];return pe&&pe.cash?pe.cash:null;}
function openOf(st,coId,month,item,kind){
  if(item.openOverride!=null)return item.openOverride;
  const p=prevCash(st,coId,month);if(!p)return item.opening||0;
  const list=p[kind]||[];
  const m=list.find(x=>x.id===item.id)||list.find(x=>norm(x.name)===norm(item.name));
  return m?(m.closing||0):(item.opening||0);}
function linkedOpen(st,coId,month,item,kind){
  const p=prevCash(st,coId,month);if(!p)return null;
  const list=p[kind]||[];
  const m=list.find(x=>x.id===item.id)||list.find(x=>norm(x.name)===norm(item.name));
  return m?(m.closing||0):null;}
function compCashSide(st,e,coId,month){
  if(!e||!e.cash)return null;const c=e.cash;
  const OA=a=>openOf(st,coId,month,a,'accounts'),OD=d=>openOf(st,coId,month,d,'dues');
  const open=sumL(c.accounts,OA),close=sumL(c.accounts,a=>a.closing||0);
  const dTien=close-open;
  const dueO=sumL(c.dues,OD),dueC=sumL(c.dues,d=>d.closing||0),dDue=dueC-dueO;
  let capIn=0,capOut=0;(c.capital||[]).forEach(x=>{const v=x.amount||0;
    if(x.type==='gop'||x.type==='vay')capIn+=v;else capOut+=v;});
  const capNet=capIn-capOut;
  const cashFlow=dTien-capNet;
  return {open,close,dTien,dueO,dueC,dDue,capIn,capOut,capNet,cashFlow,profit:cashFlow-dDue,
    hasPrev:!!prevCash(st,coId,month),
    hasData:(c.accounts||[]).some(a=>OA(a)||a.closing)};
}
const closeDebt=x=>(x.opening||0)+(x.increase||0)-(x.decrease||0);
const dDebt=a=>(a||[]).reduce((s,x)=>s+((x.increase||0)-(x.decrease||0)),0);
/* --- ĐỐI CHIẾU 2 BÊN --- */
function reconcile(st,e,coId,mid,month){
  const p=compPnL(st,e,mid,month),c=compCashSide(st,e,coId,month);
  if(!p||!c)return null;
  const inv=invBE(st,coId,mid,month);
  const dInv=inv.end-inv.begin;
  const dPlat=(e.platformEnd||0)-(e.platformBegin||0);
  const dRecv=dDebt(e.receivables);
  const dPay=dDebt(e.payables);
  const incPay=!e.duesIncludePayables;
  const explain=[{k:'Δ Tồn kho',v:dInv,note:'Tiền chôn thêm vào hàng'},
    {k:'Δ Tiền sàn chưa đối soát',v:dPlat,note:'Sàn còn giữ tiền'},
    {k:'Δ Phải thu khách',v:dRecv,note:'Khách chưa trả tiền'}];
  if(incPay)explain.push({k:'Δ Phải trả NCC',v:-dPay,note:'Chưa trả tiền NCC'});
  const sum=explain.reduce((a,b)=>a+b.v,0);
  const gap=p.profit-c.profit;
  return {pnl:p.profit,cash:c.profit,gap,explain,sum,residual:gap-sum,incPay};
}
function aggregate(st,ids,month){let net=0,pnl=0,cash=0,plan=0,recv=0,pay=0,plat=0,inv=0,n=0,nc=0;
  ids.forEach(cid=>{const co=st.companies.find(c=>c.id===cid);if(!co)return;const e=st.entries[cid+'|'+month];if(!e)return;
    const r=rateFor(st,co.marketId,month),p=compPnL(st,e,co.marketId,month),cs=compCashSide(st,e,cid,month);
    if(p&&p.hasData){n++;net+=p.net*r;pnl+=p.profit*r;}
    if(cs&&cs.hasData){nc++;cash+=cs.profit*r;}
    if(e.plan!=null)plan+=e.plan*r;
    (e.receivables||[]).forEach(x=>recv+=closeDebt(x)*r);(e.payables||[]).forEach(x=>pay+=closeDebt(x)*r);
    plat+=(e.platformEnd||0)*r;inv+=invBE(st,cid,co.marketId,month).end*r;});
  return {net,pnl,cash,plan,recv,pay,plat,inv,n,nc};}
function unmappedVariants(st){const groups={};
  Object.keys(st.entries).forEach(ek=>{const e=st.entries[ek];if(!e.variants)return;
    Object.keys(e.variants).forEach(ch=>Object.keys(e.variants[ch]).forEach(vk=>{
      const v=e.variants[ch][vk];
      if(resolveSku(st,ch,v,vk))return;                    // đã ghép rồi thì bỏ qua
      const al=vAliases(ch,v,vk);
      const gk=al.find(x=>x.indexOf('sku:')===0)||al[0];   // gộp theo mã hàng nếu có
      if(!groups[gk])groups[gk]={key:gk,ch,vk,name:v.name,variation:v.variation||'',sku:v.sku||'',qty:0,members:[]};
      const g=groups[gk];g.qty+=v.qty;
      if(!g.members.some(m=>m.ch===ch&&m.vk===vk))g.members.push({ch,vk,name:v.name,variation:v.variation||'',sku:v.sku||''});
      if(!g.sku&&v.sku)g.sku=v.sku;
      if(g.members.length>1&&!g.channels)g.channels=[...new Set(g.members.map(m=>m.ch))];
    }));});
  return Object.values(groups).sort((a,b)=>b.qty-a.qty);}

const DONUT_COLORS=['#4F46E5','#0E9488','#7C3AED','#F59E0B','#EC4899','#3B82F6','#10B981','#EF4444'];
function Donut({data,size,center}){size=size||160;
  const clean=data.filter(d=>d.value>0);const total=clean.reduce((a,d)=>a+d.value,0)||1;
  const r=size/2,ir=r*0.62;let ang=-Math.PI/2;
  const arcs=clean.map((d,i)=>{const frac=d.value/total,a0=ang,a1=ang+frac*2*Math.PI;ang=a1;
    const P=(rad,a)=>[r+rad*Math.cos(a),r+rad*Math.sin(a)];
    const[x0,y0]=P(r,a0),[x1,y1]=P(r,a1),[xi1,yi1]=P(ir,a1),[xi0,yi0]=P(ir,a0);
    const lg=frac>0.5?1:0;
    return {path:`M${x0} ${y0}A${r} ${r} 0 ${lg} 1 ${x1} ${y1}L${xi1} ${yi1}A${ir} ${ir} 0 ${lg} 0 ${xi0} ${yi0}Z`,
      color:d.color||DONUT_COLORS[i%DONUT_COLORS.length]};});
  return <div className="donut-c" style={{width:size,height:size}}>
    <svg viewBox={'0 0 '+size+' '+size} style={{width:size,height:size}}>
      {arcs.length?arcs.map((a,i)=><path key={i} d={a.path} fill={a.color}/>) 
        :<circle cx={r} cy={r} r={(r+ir)/2} fill="none" stroke="var(--line)" strokeWidth={r-ir}/>}
    </svg>{center&&<div className="mid">{center}</div>}</div>;}
function BarChart({data}){const height=220,max=Math.max(1,...data.map(d=>Math.abs(d.value)));

function GapChart({pnl,cash,items}){
  const height=290,W=680,pad=20;const steps=[{l:'LN kinh doanh',v:pnl,t:'start'},
    ...items.map(i=>({l:i.k,v:-i.v,t:'d'})),{l:'LN dòng tiền',v:cash,t:'end'}];

    mx=Math.max(mx,pts[pts.length-1].t);mn=Math.min(mn,pts[pts.length-1].b);});

      {s.l.split(' ').reduce((a,w,j)=>{const li=Math.floor(j/2);a[li]=(a[li]||'')+' '+w;return a;},[]).slice(0,2).map((ln,j)=>

function LineChart({data,color}){color=color||'#0E9488';const h=210,w=Math.max(340,data.length*80),padL=8,padR=8;

/* Lưu trữ đa tầng: window.storage (môi trường claude.ai) -> localStorage (file tải về) */
const SKEY='gochek_v5';
async function loadState(){
  try{if(window.storage){const r=await window.storage.get(SKEY);if(r&&r.value)return JSON.parse(r.value);}}catch(e){}
  try{const v=localStorage.getItem(SKEY);if(v)return JSON.parse(v);}catch(e){}
  return null;}
function saveState(n){const s=JSON.stringify(n);
  try{if(window.storage)window.storage.set(SKEY,s);}catch(e){}
  try{localStorage.setItem(SKEY,s);}catch(e){}}
/* Xoá dữ liệu CHẮC CHẮN: chờ ghi xong window.storage, xoá cả file gốc đã lưu, rồi tải lại trang.
   mode='data' → xoá dữ liệu mọi kỳ nhưng GIỮ cấu hình; mode='all' → về mặc định gốc. */
function hardWipe(mode,st,done){
  let clean;
  if(mode==='all')clean=freshState();
  else{clean=JSON.parse(JSON.stringify(st));
    clean.entries={};clean.stock={};clean.orderIds={};clean.logs=[];
    clean.skuMap={};clean.catMap={};clean.colMap={};clean.costHint={};}
  const oldMeta=(st&&st.fileMeta)||{};clean.fileMeta={};
  const s=JSON.stringify(clean);
  try{localStorage.setItem(SKEY,s);}catch(e){}          // localStorage sạch NGAY (đồng bộ, không thể treo)
  if(typeof done==='function')done(clean);               // cập nhật giao diện NGAY, không chờ server
  try{if(window.storage){                                 // dọn bản lưu trên server ở NỀN, không chặn giao diện
    Promise.resolve(window.storage.set(SKEY,s)).catch(function(){});
    Object.keys(oldMeta).forEach(function(id){try{if(window.storage.delete)Promise.resolve(window.storage.delete('gcfile_'+id)).catch(function(){});}catch(e){}});
  }}catch(e){}}

const N=v=>{if(typeof v==='number')return v;if(v==null||v==='')return 0;
  const orig=String(v);const neg=/^\s*[-(]/.test(orig)||/-\s*[\d]/.test(orig);
  let s=orig.replace(/[^\d.,]/g,'');if(!s)return 0;
  const di=s.lastIndexOf('.'),ci=s.lastIndexOf(',');
  let dec=null,idx=-1;
  if(di>=0&&ci>=0){dec=di>ci?'.':',';idx=Math.max(di,ci);}
  else if(ci>=0){const parts=s.split(',');if(parts.length===2&&parts[1].length!==3){dec=',';idx=ci;}}
  else if(di>=0){const parts=s.split('.');if(parts.length===2&&parts[1].length!==3){dec='.';idx=di;}}
  let num;
  if(dec){num=Number(s.slice(0,idx).replace(/[.,]/g,'')+'.'+s.slice(idx+1).replace(/[.,]/g,''));}
  else{num=Number(s.replace(/[.,]/g,''));}
  if(isNaN(num))return 0;return neg?-Math.abs(num):num;};
const monthOf=v=>{if(!v)return null;const s=String(v);let m=s.match(/(\d{4})[\/-](\d{2})/);if(m)return m[1]+'-'+m[2];
  m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+'-'+m[2];return null;};

function Importer({st,persist,month,co,goSku,me}){

  const [hot,setHot]=useState(false),[msg,setMsg]=useState(null);
  const key=co.id+'|'+month,entry=st.entries[key],ccy=CCY[co.marketId];
  const fixRef=ws=>{let mr=0,mc=0,f=false;
    for(const k in ws){if(k[0]==='!')continue;const m=k.match(/^([A-Z]+)(\d+)$/);if(!m)continue;
      const c=XLSX.utils.decode_col(m[1]),r=parseInt(m[2],10)-1;if(r>mr)mr=r;if(c>mc)mc=c;f=true;}
    if(f)ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});return ws;};

  const readOne=f=>new Promise((ok,bad)=>{const rd=new FileReader();
    rd.onload=e=>{try{
      const u8=new Uint8Array(e.target.result);

      const names=wb.SheetNames;let want;
      const pf=Object.values(PRESETS).find(p=>p.sheetPrefix&&names.some(n=>n.startsWith(p.sheetPrefix)));
      const ps=Object.values(PRESETS).find(p=>p.sheet&&names.includes(p.sheet));

        const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});if(!arr.length)return;
        const isLbl=v=>{const s=String(v==null?'':v).trim();if(!s)return false;
          if(/^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/.test(s))return false;
          if(/^-?[\d.,\s]+%?$/.test(s)&&/\d/.test(s))return false;return true;};
        let hi=-1,pk=null;

          if(hit){hi=i;pk=hit[0];break;}}

          rows=arr.slice(hi+1).filter(r=>r.some(x=>x!==''&&x!=null)).map(r=>{const o={};header.forEach((h,i)=>{if(h)o[h]=r[i];});return o;});}
        else{const nc=arr.reduce((m,r)=>Math.max(m,r.length),0);

          rows=arr.filter(r=>r.some(x=>x!==''&&x!=null)).map(r=>{const o={};header.forEach((h,i)=>{o[h]=r[i];});return o;});}
        out.push({sheet:sn,header,rows,preset:pk});});

      ok({name:f.name,size:f.size,b64,parts:out});}catch(err){bad(err);}};
    rd.onerror=()=>bad(new Error('không đọc được file'));rd.readAsArrayBuffer(f);});

        if(known.length){known.forEach(p=>{groups[p.preset]=groups[p.preset]||{rows:[],files:[],header:p.header};
          groups[p.preset].rows.push(...p.rows);if(!groups[p.preset].files.includes(f.name))groups[p.preset].files.push(f.name);});}
        else{const parts=f.parts.filter(p=>p&&p.rows&&p.rows.length);
          const multi=parts.length>1;
          parts.forEach(p=>freeFiles.push({name:f.name+(multi?' · '+p.sheet:''),sheet:p.sheet,header:p.header,rows:p.rows}));}});
      if(Object.keys(groups).length){
        const ent=Object.entries(groups);
        // đơn hàng phân tích trước để lấy danh sách ID, finance dùng ngay trong cùng lượt tải
        const ordersFirst=ent.filter(([k])=>PRESETS[k].kind!=='finance');
        const financeAfter=ent.filter(([k])=>PRESETS[k].kind==='finance');
        const out=[];const freshIds={};
        ordersFirst.forEach(([k,g])=>{const R=analyze(k,g);out.push(R);
          if(R.kind==='orders'&&R.ids)freshIds[R.channel]=R.ids;});
        financeAfter.forEach(([k,g])=>out.push(analyze(k,g,null,freshIds)));
        setRes(out);}
      if(freeFiles.length){
        setFree(freeFiles.map(f=>{
          const fp=f.header.filter(x=>x).slice(0,25).join('|');
          const saved=st.colMap[fp];
          const numeric=f.header.filter(h=>h&&isNumCol(f.rows,h));
          const G=guessKind(f.header,f.rows,f.name);
          const kind=saved?saved.kind:G.kind;
          const mk=k=>k==='stock'?{sku:guess(f.header,f.rows,'sku'),qty:guess(f.header,f.rows,'qty')||numeric[0]||''}
            :k==='order'?{id:guess(f.header,f.rows,'order')||guess(f.header,f.rows,'sku'),
              date:guess(f.header,f.rows,'date'),qty:guess(f.header,f.rows,'qty'),
              amount:guess(f.header,f.rows,'amount')||numeric[0]||'',
              costUnit:guess(f.header,f.rows,'costUnit'),costTotal:guess(f.header,f.rows,'costTotal'),
              vkey:guess(f.header,f.rows,'sku'),vname:guess(f.header,f.rows,'pname'),
              status:guess(f.header,f.rows,'status')}
            :k==='revenue'?{amount:guess(f.header,f.rows,'amount')||numeric[0]||'',date:guess(f.header,f.rows,'date'),note:guess(f.header,f.rows,'cat')}
            :k==='ledger'?{cat:guess(f.header,f.rows,'cat'),amount:guess(f.header,f.rows,'amount')||numeric[0]||'',date:guess(f.header,f.rows,'date')}
            :{cat:guess(f.header,f.rows,'cat'),amount:guess(f.header,f.rows,'amount')||numeric[0]||'',
              ccy:guess(f.header,f.rows,'ccy'),note:guess(f.header,f.rows,'note')};
          return {...f,fp,kind,map:saved?saved.map:mk(kind),numeric,guess:G,confirmed:!!saved,mk};}));
      }
      if(!Object.keys(groups).length&&!freeFiles.length)setMsg({t:'err',m:'Không đọc được dữ liệu từ file.'});
    }catch(err){setBusy(null);setMsg({t:'err',m:'Lỗi đọc file: '+err.message});}};

  function analyze(pk,g,scaleOverride,freshIds){
    const P=PRESETS[pk],F=P.fields;let rows=P.rowFilter?g.rows.filter(P.rowFilter):g.rows;
    const R={preset:pk,label:P.label,files:g.files,kind:P.kind,channel:P.channel,rows:rows.length,_rows:g.rows,_header:g.header};
    R.usedCols=Object.keys(F||{}).map(k=>F[k]).filter(x=>typeof x==='string');
    if(P.fees)Object.keys(P.fees).forEach(k=>P.fees[k].forEach(c=>{if(R.usedCols.indexOf(c)<0)R.usedCols.push(c);}));
    if(P.kind==='orders'){
      // lọc theo kỳ đang chọn nếu đọc được ngày
      const byMonthAll={};rows.forEach(r=>{const mo=monthOf(r[F.date]);if(mo)byMonthAll[mo]=(byMonthAll[mo]||0)+1;});
      let excluded=0,filtered=false;
      if(byMonthAll[month]){const before=rows.length;
        rows=rows.filter(r=>{const mo=monthOf(r[F.date]);return !mo||mo===month;});
        excluded=before-rows.length;filtered=true;}
      const seen={},variants={},costs={};let gross=0,refund=0,qty=0,canc=0,cogsFile=0,hasCost=false,noCost=0,noCostRev=0;const ids=[];
      const RV=P.rev;const rv={};const rvSeen={};
      if(RV){(RV.line||[]).concat(RV.lineQty||[],RV.order||[]).forEach(x=>rv[x[0]]=0);}
      rows.forEach(r=>{if(P.skipDesc&&String(r[F.id]||'').includes('unique order ID'))return;
        const id=String(r[F.id]||'').trim();if(!id)return;
        if(P.cancelled(r[F.status])){canc++;return;}
        const q=N(r[F.qty]);
        if(RV){
          (RV.line||[]).forEach(x=>{if(r[x[2]]!==undefined)rv[x[0]]+=Math.abs(N(r[x[2]]));});
          (RV.lineQty||[]).forEach(x=>{if(r[x[2]]!==undefined)rv[x[0]]+=Math.abs(N(r[x[2]]))*N(r[F.qty]);});
          if(!rvSeen[id]){rvSeen[id]=1;(RV.order||[]).forEach(x=>{if(r[x[2]]!==undefined)rv[x[0]]+=Math.abs(N(r[x[2]]));});}}
        if(P.lineLevel){gross+=N(r[F.amount]);if(!seen[id]){seen[id]=1;ids.push(id);}}
        else if(!seen[id]){seen[id]=1;ids.push(id);gross+=N(r[F.amount]);if(F.refund)refund+=N(r[F.refund]);}
        qty+=q;
        if(F.costTotal&&r[F.costTotal]!==undefined){const cv=Math.abs(N(r[F.costTotal]));cogsFile+=cv;hasCost=true;
          if(!cv&&N(r[F.amount])){noCost++;noCostRev+=N(r[F.amount]);}}
        else if(F.costUnit&&r[F.costUnit]!==undefined){const cv=Math.abs(N(r[F.costUnit]))*q;cogsFile+=cv;hasCost=true;
          if(!cv&&N(r[F.amount])){noCost++;noCostRev+=N(r[F.amount]);}}
        const vk=F.vkey?String(r[F.vkey]||'').trim():(String(r[F.vkeyA]||'').trim()+' | '+String(r[F.vkeyB]||'').trim());
        if(vk&&vk!==' | '){
          const pname=F.vname?String(r[F.vname]||'').trim():vk;
          const pvar=F.vvar?String(r[F.vvar]||'').trim():'';
          const psku=F.vsku?String(r[F.vsku]||'').trim():'';
          variants[vk]=variants[vk]||{name:pname.slice(0,140),variation:pvar.slice(0,80),sku:psku.slice(0,60),qty:0};
          if(!variants[vk].sku&&psku)variants[vk].sku=psku.slice(0,60);
          variants[vk].qty+=q;
          if(F.costUnit&&q)costs[vk]=Math.abs(N(r[F.costUnit]));
          else if(F.costTotal&&q)costs[vk]=Math.round(Math.abs(N(r[F.costTotal]))/q);}});
      let cogs=0,mapped=0;Object.keys(variants).forEach(k=>{const pid=resolveSku(st,P.channel,variants[k],k);
        if(pid){mapped+=variants[k].qty;cogs+=variants[k].qty*costOf(st,pid,co.marketId);}});
      let revRows=null;
      if(RV&&rv.list){revRows=(RV.line||[]).concat(RV.lineQty||[],RV.order||[])
        .map(x=>({k:x[0],label:x[1],col:x[2],sign:x[3],amount:rv[x[0]]||0})).filter(x=>x.amount);
        const calc=revRows.reduce((a,b)=>a+b.sign*b.amount,0);
        revRows.push({k:'other',label:'Chênh lệch khác (phí ship, làm tròn…)',col:'',sign:1,amount:gross-calc});}
      Object.assign(R,{gross,refund,net:gross-refund,qty,orders:ids.length,cancelled:canc,ids,variants,revRows,
        byMonth:byMonthAll,excluded,filtered,hasCost,cogsFile,costs,noCost,noCostRev,
        cogs:hasCost?cogsFile:cogs,cov:hasCost?1:(qty?mapped/qty:0),nVar:Object.keys(variants).length});}
    if(P.kind==='stock'){
      const hdr=g.header||Object.keys(rows[0]||{});
      const cQty=pickCol(hdr,STOCK_COLS.qty,/tồn/i);
      const cSku=pickCol(hdr,STOCK_COLS.sku,/mã/i);
      const cSku2=hdr.find(h=>/mã vạch|barcode/i.test(h)&&h!==cSku)||'';
      const cName=pickCol(hdr,STOCK_COLS.name,/tên/i);
      const cCost=pickCol(hdr,STOCK_COLS.cost,null);
      const cVal=pickCol(hdr,STOCK_COLS.value,null);
      const sc=scaleOverride!=null?scaleOverride:(scale[pk]||1);
      const q={},unk=[],newP=[];let val=0,valCol=0,costSum=0,costN=0;
      rows.forEach(r=>{let sku=String(r[cSku]||'').trim();
        if(!sku&&cSku2)sku=String(r[cSku2]||'').trim();
        if(!sku)return;const n=N(r[cQty]);
        const nm=cName?String(r[cName]||'').trim():'';
        const cst=cCost?Math.abs(N(r[cCost]))*sc:0;
        if(cVal)valCol+=Math.abs(N(r[cVal]))*sc;
        if(cst){costSum+=cst;costN++;}
        q[sku]=q[sku]||{qty:0,name:nm};q[sku].qty+=n;if(nm&&!q[sku].name)q[sku].name=nm;
        const pr=st.products.find(p=>p.sku===sku);const hint=(st.costHint||{})[sku];
        const use=pr?costOf(st,pr.id,co.marketId):(cst||hint||0);
        if(!use)unk.push(sku);
        val+=n*use;
        if(!pr&&!newP.some(x=>x.sku===sku)&&!/\+/.test(sku))newP.push({sku,name:nm||sku,cost:cst||hint||0,qty:n});});
      newP.sort((a,b)=>(b.cost*b.qty)-(a.cost*a.qty));
      // phát hiện combo
      const allSkus=Object.keys(q);const newCombos=[];
      allSkus.forEach(sku=>{
        if((st.combos||{})[sku])return;
        const comps=guessCombo(sku,q[sku].name,allSkus);
        if(!comps||!comps.some(c=>c.sku))return;
        const cq=q[sku].qty||0;
        const dup=comps.filter(c=>c.sku&&q[c.sku]&&Math.abs((q[c.sku].qty||0)-cq)<0.001);
        newCombos.push({sku,name:q[sku].name,qty:cq,comps,
          dupSkus:dup.map(c=>c.sku),mode:dup.length?'virtual':'explode'});});
      const avgCost=costN?costSum/costN:0;
      const mid=co.marketId;
      const suspicious=!!cCost&&avgCost>0&&((mid==='vn'&&avgCost<2000)||(mid==='id'&&avgCost<5000));
      Object.assign(R,{q,unk:[...new Set(unk)],val,valCol,skus:Object.keys(q).length,
        cols:{qty:cQty,sku:cSku,name:cName,cost:cCost,value:cVal},newP,hasCostCol:!!cCost,
        avgCost,suspicious,scale:sc,newCombos});}
    if(P.kind==='finance'){
      const fresh=freshIds&&freshIds[P.channel];
      const oids=fresh||(st.orderIds||{})[key+'|'+P.channel];
      const set=oids?new Set(oids):null;
      R.idSource=fresh?'file vừa tải':'kỳ đã lưu';
      let settle=0,matched=0,skipped=0;const fees={},byMonth={},seen=new Set();
      Object.keys(P.fees).forEach(k=>fees[k]=0);
      const detail={};let fileFee=0;
      rows.forEach(r=>{const id=String(r[F.id]||'').trim();if(!id)return;
        const mo=monthOf(r[F.date]);if(mo)byMonth[mo]=(byMonth[mo]||0)+1;
        if(set&&!set.has(id)){skipped++;return;}
        matched++;seen.add(id);settle+=N(r[F.settle]);
        if(P.totalFeeCol&&r[P.totalFeeCol]!==undefined)fileFee+=N(r[P.totalFeeCol]);
        Object.keys(P.fees).forEach(k=>P.fees[k].forEach(c=>{if(r[c]!==undefined){
          const v=N(r[c]);fees[k]+=v;                       // giữ nguyên dấu: âm = mất tiền, dương = được trợ giá
          if(v){detail[c]=detail[c]||{cat:k,col:c,amount:0};detail[c].amount+=v;}}}));});
      // đảo dấu để ra CHI PHÍ (dương = tốn tiền, âm = được hoàn/trợ giá)
      Object.keys(fees).forEach(k=>fees[k]=-fees[k]);
      Object.keys(detail).forEach(c=>{detail[c].amount=-detail[c].amount;
        if(!detail[c].amount)delete detail[c];});
      R.feeDetail=Object.values(detail).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));
      R.fileFee=P.totalFeeCol?-fileFee:null;
      R.classified=Object.values(fees).reduce((a,b)=>a+b,0);
      Object.assign(R,{settle,matched,skipped,fees,byMonth,hasOrders:!!set,
        unsettled:set?[...set].filter(x=>!seen.has(x)).length:0,totalOrders:set?set.size:0});}
    return R;}

              <div style={{maxHeight:300,overflow:'auto',border:'1px solid var(--line)',borderRadius:10}}>
                <table><thead><tr><th style={{width:40}}>Thêm</th><th>Mã SKU</th><th>Tên sản phẩm</th><th className="r">SL tồn</th><th className="r">Giá vốn</th></tr></thead>
                <tbody>{R.newP.slice(0,300).map(x=><tr key={x.sku}>
                  <td><input type="checkbox" checked={!skip[x.sku]} onChange={()=>setSkip({...skip,[x.sku]:!skip[x.sku]})}/></td>
                  <td><b>{x.sku}</b></td><td style={{maxWidth:340}}>{x.name}</td>
                  <td className="r num">{nf.format(x.qty)}</td>
                  <td className={'r num '+(x.cost?'':'warnc')}>{x.cost?fmt(x.cost,ccy):'chưa có'}</td></tr>)}</tbody></table></div>
              <div className="noteline">Bấm <b>Áp dụng</b> bên dưới là các mã được tick sẽ vào thẳng <b>Cấu hình → Sản phẩm</b> kèm giá vốn cho thị trường {(st.markets.find(m=>m.id===co.marketId)||{}).name}.</div>
            </div>}</>}
          {R.kind==='finance'&&<>

            {R.hasOrders&&<><div className="recon" style={{marginBottom:14}}>
              <div><div className="k">Dòng khớp đơn kỳ này</div><div className="v num pos">{nf.format(R.matched)}</div></div>
              <div><div className="k">Đã loại (kỳ khác)</div><div className="v num warnc">{nf.format(R.skipped)}</div></div>
              <div><div className="k">Đơn chưa đối soát</div><div className="v num">{nf.format(R.unsettled)}</div></div>
              <div><div className="k">Tổng đơn kỳ này</div><div className="v num">{nf.format(R.totalOrders)}</div></div></div>
              <div className="noteline ok" style={{marginTop:0,marginBottom:14}}>Lọc theo <b>ID đơn hàng</b>: chỉ lấy chi phí của đơn đặt trong tháng {month.replace('-','/')}, bỏ {nf.format(R.skipped)} dòng kỳ khác.</div></>}

                const v=R.fees[k];if(!v)return null;

                <tr><td>Tổng phí ghi trong file</td><td className="r num muted">({fmt(R.fileFee,ccy)})</td></tr>

        </div></div>)}

/* ===== SKU MAP ===== */
function SkuMap({st,persist,unmapped}){
  const [q,setQ]=useState('');const [cb,setCb]=useState(null);const mapped=Object.keys(st.skuMap||{});
  const startCombo=u=>setCb({key:u.key,name:(u.name||'')+(u.variation?' — '+u.variation:''),
    sku:'COMBO-'+String(u.sku||u.vk||'').replace(/[^A-Za-z0-9-]/g,'').slice(0,14).toUpperCase(),
    comps:[{pid:'',qty:1},{pid:'',qty:1}]});
  const saveCombo=()=>{
    const comps=cb.comps.filter(c=>c.pid);
    if(comps.length<2){alert('Combo cần ít nhất 2 sản phẩm thành phần.');return;}
    if(!cb.sku.trim()){alert('Anh đặt mã SKU cho combo.');return;}
    const n=JSON.parse(JSON.stringify(st));
    if(n.products.some(p=>p.sku===cb.sku.trim())){alert('Mã SKU "'+cb.sku.trim()+'" đã tồn tại.');return;}
    const id=uid();
    n.products.push({id,sku:cb.sku.trim(),name:cb.name.slice(0,140),kind:'combo',cost:{},price:{},
      components:comps.map(c=>({sku:(n.products.find(p=>p.id===c.pid)||{}).sku,qty:c.qty||1}))});
    n.skuMap[cb.key]=id;persist(n);setCb(null);};
  const mappedInfo={};Object.keys(st.entries).forEach(ek=>{const e=st.entries[ek];if(!e.variants)return;
    Object.keys(e.variants).forEach(ch=>Object.keys(e.variants[ch]).forEach(vk=>{
      const kk=ch+'|'+vk;if(!mappedInfo[kk])mappedInfo[kk]=e.variants[ch][vk];}));});
  const setGroup=(g,pid)=>{const n=JSON.parse(JSON.stringify(st));
    const keys=[];(g.members||[{ch:g.ch,vk:g.vk,name:g.name,variation:g.variation,sku:g.sku}])
      .forEach(m=>vAliases(m.ch,m,m.vk).forEach(a=>{if(keys.indexOf(a)<0)keys.push(a);}));
    if(g.key&&keys.indexOf(g.key)<0)keys.push(g.key);
    keys.forEach(a=>{if(pid)n.skuMap[a]=pid;else delete n.skuMap[a];});
    persist(n);};
  const set=(k,pid)=>{const n=JSON.parse(JSON.stringify(st));if(pid)n.skuMap[k]=pid;else delete n.skuMap[k];persist(n);};
  const ql=q.toLowerCase();
  const list=unmapped.filter(u=>!q||[u.name,u.variation,u.sku,u.vk].some(x=>String(x||'').toLowerCase().includes(ql)));
  const tq=unmapped.reduce((a,b)=>a+b.qty,0);
  const rawCount=unmapped.reduce((a,b)=>a+((b.members&&b.members.length)||1),0);
  const mappedProducts=[...new Set(Object.values(st.skuMap||{}))].length;
  return <div>
    {(unmapped.length>0||mapped.length>0)&&<div className="card" style={{marginBottom:12,display:'flex',alignItems:'center',gap:10,borderColor:'var(--warn)'}}>
      <span style={{fontSize:13,color:'var(--tx2)'}}>Dữ liệu bên dưới đến từ file anh đã nạp trước đó (đang lưu trong trình duyệt), không phải app tạo sẵn.</span>
      <button className="btn sm" style={{marginLeft:'auto'}} onClick={async()=>{if(confirm('Xoá TẤT CẢ dữ liệu đã nhập của MỌI kỳ:\n• Đơn hàng, đối soát, chi phí, tồn kho\n• Ghép SKU sàn, ghép tên chi phí, file gốc, nhật ký\n\nGIỮ LẠI danh mục sản phẩm & cấu hình. KHÔNG hoàn tác được.'))await hardWipe('data',st,persist);}}>↺ Xoá sạch dữ liệu đã nhập</button></div>}
    <div className="grid k3" style={{marginBottom:16}}>
      <Kpi label="Dòng cần ghép" value={unmapped.length} tone={unmapped.length?'warn':'pos'}
        sub={rawCount>unmapped.length?('đã gộp từ '+rawCount+' mã trên sàn'):'mỗi dòng là một phân loại'}/>
      <Kpi label="SL chưa tính giá vốn" value={nf.format(tq)} tone={tq?'warn':'pos'}/>
      <Kpi label="Đã ghép" value={mappedProducts} tone="pos" sub="sản phẩm đã gán"/></div>
    {cb&&<div className="card" style={{marginBottom:16,borderColor:'var(--stock)'}}>
      <div className="hd"><h3>Tạo sản phẩm combo từ nhiều sản phẩm nhỏ</h3>
        <span className="tag stock">Combo</span>
        <button className="btn sm" style={{marginLeft:'auto'}} onClick={()=>setCb(null)}>Đóng</button></div>
      <div className="bd">
        <div className="maprow"><div>Mã SKU cho combo<span className="need">BẮT BUỘC</span></div>
          <input className="inp txt" value={cb.sku} onChange={e=>setCb({...cb,sku:e.target.value})}/></div>
        <div className="maprow"><div>Tên combo</div>
          <input className="inp txt" value={cb.name} onChange={e=>setCb({...cb,name:e.target.value})}/></div>
        <div style={{marginTop:12,fontSize:13,fontWeight:600}}>Sản phẩm thành phần</div>
        {cb.comps.map((c,i)=><div key={i} style={{display:'flex',gap:8,alignItems:'flex-start',marginTop:8}}>
          <div style={{flex:1}}><ProductPicker products={st.products.filter(p=>p.kind!=='combo')} value={c.pid}
            onChange={v=>{const a=[...cb.comps];a[i]={...c,pid:v};setCb({...cb,comps:a});}}/></div>
          <div style={{width:90}}><Money value={c.qty} onChange={v=>{const a=[...cb.comps];a[i]={...c,qty:v||1};setCb({...cb,comps:a});}}/></div>
          <button className="iconbtn" onClick={()=>setCb({...cb,comps:cb.comps.filter((_,j)=>j!==i)})}>✕</button></div>)}
        <button className="btn sm" style={{marginTop:8}} onClick={()=>setCb({...cb,comps:[...cb.comps,{pid:'',qty:1}]})}>+ Thêm thành phần</button>
        <div style={{marginTop:14,padding:'10px 12px',background:'#FAFAFC',border:'1px solid var(--line)',borderRadius:10}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--tx2)',marginBottom:6}}>GIÁ VỐN COMBO TỰ TÍNH</div>
          {st.markets.map(m=>{const sum=cb.comps.reduce((a,c)=>{const p=st.products.find(x=>x.id===c.pid);
            return a+(p?costOf(st,p.id,m.id)*(c.qty||1):0);},0);
            if(!sum)return null;
            return <div key={m.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'3px 0'}}>
              <span>{m.name}</span><b className="num">{fmt(sum,m.ccy)}</b></div>;})}
          {!cb.comps.some(c=>c.pid)&&<div className="muted" style={{fontSize:12.5}}>Chọn thành phần để xem giá vốn.</div>}</div>
        <div style={{display:'flex',gap:10,marginTop:14}}>
          <button className="btn pri" onClick={saveCombo}>Tạo combo &amp; gán vào dòng này</button>
          <button className="btn" onClick={()=>setCb(null)}>Huỷ</button></div>
        <div className="noteline">Combo được thêm vào <b>Cấu hình → Sản phẩm</b>, giá vốn tự cộng từ các thành phần theo từng thị trường —
          thành phần đổi giá thì combo đổi theo, không phải sửa lại.</div>
      </div></div>}
    {unmapped.length===0?<div className="card"><div className="empty"><b>Đã ghép hết</b>Giá vốn đang tính đủ 100%.</div></div>:
    <div className="card"><div className="hd"><h3>Gán biến thể từ sàn vào sản phẩm của anh</h3>
      <input className="inp txt" placeholder="Tìm theo tên, phân loại, SKU…" style={{width:280,marginLeft:'auto'}} value={q} onChange={e=>setQ(e.target.value)}/></div>
      <table><thead><tr>
        <th>Kênh</th><th style={{minWidth:200}}>Tên sản phẩm trên sàn</th><th style={{minWidth:130}}>Phân loại</th>
        <th style={{minWidth:120}}>SKU của sàn</th><th className="r">SL bán</th><th style={{width:260}}>Gán vào sản phẩm của anh</th></tr></thead>
      <tbody>{list.slice(0,200).map(u=><tr key={u.key}>
        <td><span className="pill" style={{background:'#EEF0F5',color:'var(--tx2)'}}>{u.ch}</span></td>
        <td style={{maxWidth:330}}>{u.name}
          {u.members&&u.members.length>1&&<div className="pill" style={{background:'var(--posbg)',color:'var(--pos)',marginTop:4}}>
            gộp {u.members.length} mã sàn cùng hàng này</div>}</td>
        <td>{u.variation?<b>{u.variation}</b>:<span className="muted">—</span>}</td>
        <td>{u.sku?<b className="num">{u.sku}</b>:<span className="muted" style={{fontSize:11}}>không có</span>}
          <div className="mono-tk">{u.vk!==u.sku?u.vk:''}</div></td>
        <td className="r num">{nf.format(u.qty)}</td>
        <td><ProductPicker products={st.products} value={st.skuMap[u.key]||''} onChange={v=>setGroup(u,v)}/>
          <button className="btn sm" style={{marginTop:5}} onClick={()=>startCombo(u)}>＋ Tạo combo từ dòng này</button></td></tr>)}</tbody></table>
      <div className="bd"><div className="noteline ok"><b>Ghép một lần là xong vĩnh viễn.</b> Mỗi lần anh gán, web ghi nhớ theo 3 chìa khoá cùng lúc:
        mã SKU của sàn, mã hàng của anh (Seller SKU), và tên + phân loại. Tháng sau tải file lên, chỉ cần khớp một trong ba là tự nhận —
        kể cả khi anh đổi tên listing trên sàn hay đăng thêm listing mới cho cùng sản phẩm.</div>
        <div className="noteline">Danh sách này đếm theo <b>phân loại</b> chứ không phải theo sản phẩm: một sản phẩm bán nhiều phân loại
        (mic đơn / mic đôi / chân Type C / chân Lightning…) thì mỗi phân loại có giá vốn khác nhau nên phải ghép riêng.
        Những mã sàn dùng chung một mã hàng đã được web gộp sẵn thành một dòng.</div></div></div>}
    {mapped.length>0&&<div className="card" style={{marginTop:16}}><div className="hd"><h3>Đã ghép ({mapped.length})</h3></div>
      <table><tbody>{mapped.slice(0,120).map(k=>{const p=st.products.find(p=>p.id===st.skuMap[k]);
        const info=mappedInfo[k]||{};
        return <tr key={k}><td style={{maxWidth:420}}>{info.name||k}
          {info.variation?<span className="pill" style={{background:'#EEF0F5',color:'var(--tx2)',marginLeft:6}}>{info.variation}</span>:null}
          <div className="mono-tk">{info.sku?('SKU sàn: '+info.sku):k}</div></td>
        <td>→ <b>{p?p.sku:'?'}</b> {p?p.name:''}</td>
        <td style={{width:40}}><button className="iconbtn" onClick={()=>set(k,null)}>✕</button></td></tr>;})}</tbody></table></div>}
  </div>;
}

/* ===== KQKD ===== */
function PnL({st,month,co}){
  const [exp,setExp]=useState({});const [all,setAll]=useState(true);
  const e=st.entries[co.id+'|'+month],p=compPnL(st,e,co.marketId,month);
  const rate=rateFor(st,co.marketId,month),ccy=CCY[co.marketId];
  if(!p||!p.hasData)return <Empty name={co.name} month={month}/>;
  const chName=id=>{const c=st.channels.find(x=>x.id===id);return c?c.name:id;};
  const open=k=>all||exp[k];
  const tog=k=>setExp({...exp,[k]:!exp[k]});

  // ---- doanh thu niêm yết = SL bán × giá niêm yết đã cấu hình ----
  const RD=e.revDetail||{};
  const chs=Object.keys(e.revenue||{}).filter(ch=>((e.revenue[ch].gross||0)-(e.revenue[ch].refund||0))!==0);
  const LR=compListRev(st,e,co.marketId);
  const listTotal=LR.total;const hasList=LR.has;
  const grossAll=chs.reduce((a,ch)=>a+(e.revenue[ch].gross||0),0);
  const refundAll=chs.reduce((a,ch)=>a+(e.revenue[ch].refund||0),0);
  const mktDisc=listTotal-grossAll;              // tiền marketing đã giảm
  // số ghi trên sàn — chỉ để tham khảo
  const platRows={};
  chs.forEach(ch=>{(RD[ch]||[]).forEach(r=>{if(r.k==='list')return;
    const key=r.k+'|'+r.label;platRows[key]=platRows[key]||{label:r.label,byCh:{},total:0};
    platRows[key].byCh[ch]=(platRows[key].byCh[ch]||0)+r.amount;platRows[key].total+=r.amount;});});

  // ---- chi phí: nhóm -> danh mục -> chi tiết ----
  const detailOf=cid=>{const out=[];
    Object.keys(e.feeDetail||{}).forEach(ch=>(e.feeDetail[ch]||[]).forEach(d=>{
      if(d.cat===cid)out.push({src:chName(ch),name:d.col,amount:d.amount});}));
    ((e.costDetail||{})[cid]||[]).forEach(d=>out.push({src:'File chi phí',name:d.name,amount:d.amount}));
    return out.sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));};

  const exportX=()=>{const rows=[['BÁO CÁO KẾT QUẢ KINH DOANH — GC BCKD'],[co.name,month.replace('-','/')],[],
    ['Chỉ tiêu','TK','Nguồn / kênh','Số tiền ('+ccy+')']];
    if(hasList){rows.push(['DOANH THU NIÊM YẾT (SL × giá cấu hình)','','',listTotal]);
      Object.keys(LR.byCh).forEach(ch=>{if(LR.byCh[ch].list)rows.push(['   '+chName(ch),'','',LR.byCh[ch].list]);});
      rows.push(['(−) Giảm giá của marketing','','',-mktDisc]);
      Object.keys(LR.byCh).forEach(ch=>{const b=LR.byCh[ch];if(b.list)rows.push(['      '+chName(ch),'','',-(b.list-((e.revenue[ch]||{}).gross||0))]);});}
    rows.push(['DOANH THU GHI NHẬN','511','',grossAll]);
    chs.forEach(ch=>rows.push(['   '+chName(ch),'','',e.revenue[ch].gross||0]));
    if(refundAll)rows.push(['(−) Hoàn hàng','','',-refundAll]);
    rows.push(['DOANH THU THUẦN','','',p.net],['Giá vốn hàng bán','632','',-p.cogs],['LỢI NHUẬN GỘP','','',p.gross],[]);
    st.groups.forEach(g=>{if(!p.byGroup[g.id])return;
      rows.push([g.name.toUpperCase(),'','',-p.byGroup[g.id]]);
      st.cats.filter(c=>c.group===g.id).forEach(c=>{const o=e.opex&&e.opex[c.id];const amt=o?(o.amount||0):0;if(!amt)return;
        rows.push(['   '+c.name,c.tk||'','',-amt]);
        detailOf(c.id).forEach(d=>rows.push(['      '+d.name,'',d.src,-d.amount]));});});
    rows.push([],['LỢI NHUẬN HOẠT ĐỘNG KINH DOANH','','',p.profit]);
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:46},{wch:8},{wch:18},{wch:20}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'KQKD');
    XLSX.writeFile(wb,'GC_BCKD_KQKD_'+co.id+'_'+month+'.xlsx');};

  return <div>
    <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
      <button className="btn" onClick={exportX}>⬇ Xuất Excel (có chi tiết)</button>
      <button className={'btn'+(all?' pri':'')} onClick={()=>{setAll(!all);setExp({});}}>{all?'Đang mở chi tiết':'Mở tất cả chi tiết'}</button>
      <div style={{marginLeft:'auto',fontSize:12,color:'var(--tx2)'}}>Tiền gốc {ccy} · tỷ giá {nf.format(rate)} VND</div></div>

    {hasList&&<div className="grid kpis" style={{marginBottom:16}}>
      <Kpi label="Doanh thu niêm yết" value={fmt(listTotal,ccy)} sub={'SL bán × giá niêm yết đã cấu hình'}/>
      <Kpi label="Marketing đã giảm giá" value={fmt(mktDisc,ccy)} tone="warn"
        sub={'Bằng '+pct(listTotal?mktDisc/listTotal:0)+' doanh thu niêm yết'}/>
      <Kpi label="Doanh thu bán ra" value={fmt(grossAll,ccy)} tone="pos"
        sub={'Còn '+pct(listTotal?grossAll/listTotal:0)+' giá niêm yết'}/>
      <Kpi label="Đã khai giá niêm yết" value={pct(LR.cov)} tone={LR.cov>0.999?'pos':'warn'}
        sub={LR.cov>0.999?'đủ cho toàn bộ hàng bán':'còn '+nf.format(LR.qty-LR.mapped)+' sản phẩm chưa có giá'}/></div>}
    {hasList&&LR.cov<0.999&&<div className="noteline warn" style={{marginTop:0,marginBottom:14}}>
      Mới khai giá niêm yết cho <b>{pct(LR.cov)}</b> số lượng bán — doanh thu niêm yết và mức giảm giá đang <b>thấp hơn thực tế</b>.
      Vào <b>Cấu hình → Sản phẩm</b> điền nốt cột "Giá niêm yết".</div>}
    {!hasList&&<div className="noteline warn" style={{marginTop:0,marginBottom:14}}>
      <b>Chưa khai giá niêm yết cho sản phẩm nào.</b> Vào <b>Cấu hình → Sản phẩm</b> điền cột "Giá niêm yết" theo từng thị trường,
      báo cáo sẽ tự tính doanh thu niêm yết và số tiền marketing đã giảm.</div>}

    {p.cov<0.999&&<div className="noteline warn" style={{marginTop:0,marginBottom:14}}>Giá vốn mới tính cho <b>{pct(p.cov)}</b> số lượng bán — lợi nhuận đang <b>cao hơn thực tế</b>.</div>}

    <div className="card"><div className="hd"><h3>{co.name}</h3><span className="tag accrual">Lăng kính hoạt động kinh doanh</span></div>
    <table><thead><tr><th style={{minWidth:300}}>Chỉ tiêu</th><th>TK</th><th>Nguồn</th><th className="r">{ccy}</th><th className="r">Quy đổi VND</th></tr></thead><tbody>

      {hasList&&<>
      <tr className="group"><td colSpan={5}>DOANH THU — từ giá niêm yết tới tiền thực bán</td></tr>
      <tr className="total"><td><span style={{cursor:'pointer'}} onClick={()=>tog('list')}>{open('list')?'▾':'▸'} Doanh thu niêm yết</span>
          <span className="muted" style={{fontSize:11}}> · {nf.format(LR.qty)} sản phẩm bán ra</span></td>
        <td></td><td className="muted" style={{fontSize:11}}>SL × giá cấu hình</td>
        <td className="r num">{fmt(listTotal,ccy)}</td><td className="r num">{fmtVND(listTotal*rate)}</td></tr>
      {open('list')&&Object.keys(LR.byCh).map(ch=>{const b=LR.byCh[ch];if(!b.list)return null;
        return <tr key={'l'+ch}><td style={{paddingLeft:34}} className="muted">{chName(ch)}
          <span className="mono-tk"> {nf.format(b.mapped)}/{nf.format(b.qty)} sp có giá</span></td><td></td><td></td>
        <td className="r num muted">{fmt(b.list,ccy)}</td><td className="r num muted">{fmtVND(b.list*rate)}</td></tr>;})}
      <tr><td><span style={{cursor:'pointer'}} onClick={()=>tog('mkt')}>{open('mkt')?'▾':'▸'} (−) Giảm giá của marketing</span>
          <span className="pill" style={{background:'var(--warnbg)',color:'var(--warn)',marginLeft:6}}>{pct(listTotal?mktDisc/listTotal:0)} giá niêm yết</span></td>
        <td></td><td className="muted" style={{fontSize:11}}>niêm yết − bán ra</td>
        <td className="r num neg">({fmt(mktDisc,ccy)})</td><td className="r num neg">({fmtVND(mktDisc*rate)})</td></tr>
      {open('mkt')&&Object.keys(LR.byCh).map(ch=>{const b=LR.byCh[ch];if(!b.list)return null;
        const g=(e.revenue[ch]||{}).gross||0;const d=b.list-g;
        return <tr key={'m'+ch}><td style={{paddingLeft:34}} className="muted">{chName(ch)}
          <span className="mono-tk"> giảm {pct(b.list?d/b.list:0)}</span></td><td></td><td></td>
        <td className="r num muted">({fmt(d,ccy)})</td><td className="r num muted">({fmtVND(d*rate)})</td></tr>;})}
      {open('mkt')&&Object.keys(platRows).length>0&&<tr><td colSpan={5} style={{paddingLeft:34,background:'#FBFBFD'}}>
        <div className="mono-tk" style={{marginBottom:4}}>SỐ GHI TRÊN SÀN (tham khảo — giá gốc trên sàn thường bị đẩy cao)</div>
        {Object.keys(platRows).map(k=><div key={k} style={{fontSize:12,color:'var(--tx2)',display:'flex',justifyContent:'space-between',maxWidth:520}}>
          <span>{platRows[k].label}</span><span className="num">{fmt(platRows[k].total,ccy)}</span></div>)}</td></tr>}
      </>}

      <tr className="group"><td colSpan={5}>{hasList?'DOANH THU GHI NHẬN theo kênh bán':'DOANH THU theo kênh bán — từ file đơn hàng'}</td></tr>
      {chs.map(ch=>{const r=e.revenue[ch],nv=(r.gross||0)-(r.refund||0);
        return <tr key={ch}><td style={{paddingLeft:24}}>{chName(ch)}
          <span className="muted" style={{fontSize:11}}> ({e.orderCount&&e.orderCount[ch]?nf.format(e.orderCount[ch])+' đơn':''}{r.refund?' · hoàn '+short(r.refund):''})</span></td>
        <td className="mono-tk">511</td><td></td>
        <td className="r num">{fmt(nv,ccy)}</td><td className="r num">{fmtVND(nv*rate)}</td></tr>;})}
      <tr className="total"><td>DOANH THU THUẦN</td><td></td><td></td><td className="r num">{fmt(p.net,ccy)}</td><td className="r num">{fmtVND(p.net*rate)}</td></tr>
      <tr><td>Giá vốn hàng bán</td><td className="mono-tk">632</td><td className="muted" style={{fontSize:11}}>SKU × giá vốn</td>
        <td className="r num neg">({fmt(p.cogs,ccy)})</td><td className="r num neg">({fmtVND(p.cogs*rate)})</td></tr>
      <tr className="total"><td>LỢI NHUẬN GỘP</td><td></td><td></td><td className="r num">{fmt(p.gross,ccy)}</td><td className="r num">{fmtVND(p.gross*rate)}</td></tr>

      <tr className="group"><td colSpan={5}>CHI PHÍ HOẠT ĐỘNG</td></tr>
      {st.groups.map(g=>{if(!p.byGroup[g.id])return null;
        const cats=st.cats.filter(c=>c.group===g.id&&e.opex&&e.opex[c.id]&&(e.opex[c.id].amount||0));
        return [<tr key={g.id} className="total"><td><span style={{cursor:'pointer'}} onClick={()=>tog(g.id)}>{open(g.id)?'▾':'▸'} {g.name}</span>
            <span className="muted" style={{fontSize:11}}> · {cats.length} khoản mục</span></td>
          <td></td><td></td>
          <td className="r num neg">({fmt(p.byGroup[g.id],ccy)})</td><td className="r num neg">({fmtVND(p.byGroup[g.id]*rate)})</td></tr>,
          ...(open(g.id)?cats.flatMap(c=>{const amt=e.opex[c.id].amount||0;const det=detailOf(c.id);
            const dk=g.id+'|'+c.id;
            return [<tr key={dk}><td style={{paddingLeft:26}}>
                {det.length?<span style={{cursor:'pointer'}} onClick={()=>tog(dk)}>{open(dk)?'▾':'▸'} {c.name}</span>:c.name}
                {det.length>0&&<span className="muted" style={{fontSize:11}}> · {det.length} khoản</span>}</td>
              <td className="mono-tk">{c.tk}</td><td className="muted" style={{fontSize:11}}>{(st.sources.find(x=>x.id===(c.src||'cost'))||{}).name}</td>
              <td className="r num neg">({fmt(amt,ccy)})</td><td className="r num neg">({fmtVND(amt*rate)})</td></tr>,
              ...((open(dk)&&det.length)?det.map((d,i)=><tr key={dk+i}>
                <td style={{paddingLeft:52,fontSize:12.5}} className="muted">{d.name}
                  {d.amount<0&&<span className="pill" style={{background:'var(--posbg)',color:'var(--pos)',marginLeft:6}}>sàn trợ giá / hoàn lại</span>}</td><td></td>
                <td><span className="pill" style={{background:'#EEF0F5',color:'var(--tx2)'}}>{d.src}</span></td>
                <td className={'r num '+(d.amount<0?'pos':'muted')}>{d.amount<0?'+'+fmt(-d.amount,ccy):'('+fmt(d.amount,ccy)+')'}</td>
                <td className={'r num '+(d.amount<0?'pos':'muted')}>{d.amount<0?'+'+fmtVND(-d.amount*rate):'('+fmtVND(d.amount*rate)+')'}</td></tr>):[])];}):[])];})}

      <tr className="total"><td>LỢI NHUẬN HOẠT ĐỘNG KINH DOANH</td><td></td><td></td>
        <td className={'r num '+(p.profit>=0?'pos':'neg')}>{fmt(p.profit,ccy)}</td>
        <td className={'r num '+(p.profit>=0?'pos':'neg')}>{fmtVND(p.profit*rate)}</td></tr>
    </tbody></table></div>
    <div className="noteline">Bấm vào tên nhóm hoặc khoản mục để xem chi tiết từng khoản phí của từng sàn. Xuất Excel giữ nguyên cấu trúc này.</div>
  </div>;
}

/* ===== SỔ DÒNG TIỀN — ĐỘC LẬP HOÀN TOÀN ===== */
function PnLAdjust({st,persist,month,co,me}){
  if(me.role!=='admin')return <div className="card"><div className="empty"><b>Chỉ admin xem được bản điều chỉnh này.</b></div></div>;
  const key=co.id+'|'+month,ccy=CCY[co.marketId],rateM=rateFor(st,co.marketId,month);
  const e=st.entries[key],p=e?compPnL(st,e,co.marketId,month):null;
  if(!p||!p.hasData)return <Empty name={co.name} month={month}/>;
  const adj=e.adjust||{};const rov=adj.rev||{},cov=adj.cats||{};
  const setAdj=fn=>{const n=JSON.parse(JSON.stringify(st));const en=n.entries[key];
    en.adjust=en.adjust||{};en.adjust.rev=en.adjust.rev||{};en.adjust.cats=en.adjust.cats||{};fn(en.adjust);persist(n);};
  const chName=id=>{const c=st.channels.find(x=>x.id===id);return c?c.name:id;};
  const eff=(o,ov)=>ov!=null?ov:o;
  const chOrig=ch=>((e.revenue[ch]||{}).gross||0)-((e.revenue[ch]||{}).refund||0);
  const chs=Object.keys(e.revenue||{}).filter(ch=>chOrig(ch)!==0||rov[ch]!=null);
  const aNet=chs.reduce((s,ch)=>s+eff(chOrig(ch),rov[ch]),0);
  const aCogs=adj.cogs!=null?adj.cogs:p.cogs,aGross=aNet-aCogs;
  const catOrig=c=>{const o=e.opex&&e.opex[c.id];if(!o)return 0;let a=o.amount||0;if(o.ccy==='₫'&&ccy!=='₫')a=a/rateM;return a;};
  const groups=st.groups.map(g=>{
    const cats=st.cats.filter(c=>c.group===g.id&&(Math.abs(catOrig(c))>0.5||cov[c.id]!=null));
    const oSum=cats.reduce((s,c)=>s+catOrig(c),0),aSum=cats.reduce((s,c)=>s+eff(catOrig(c),cov[c.id]),0);
    return {g,cats,oSum,aSum};}).filter(x=>x.cats.length);
  const aOpex=groups.reduce((s,x)=>s+x.aSum,0),aProfit=aGross-aOpex;
  const hasAdj=adj.cogs!=null||Object.keys(rov).some(k=>rov[k]!=null)||Object.keys(cov).some(k=>cov[k]!=null);
  const cell=(ov,onSet,onClear)=><td>
    <div style={{display:'flex',gap:6,alignItems:'center',justifyContent:'flex-end'}}>
      <Money value={ov==null?0:ov} onChange={onSet}/>
      {ov!=null?<button className="iconbtn" title="Bỏ điều chỉnh, dùng lại số gốc" onClick={onClear}>↺</button>:<span style={{width:30,display:'inline-block'}}></span>}</div></td>;
  const dCell=(orig,effVal)=>{const d=effVal-orig;return <td className="r num">{Math.abs(d)>0.5?<span className={d>=0?'pos':'neg'}>{(d>=0?'+':'')+fmt(d,ccy)}</span>:'—'}</td>;};
  const subRow=(label,oVal,aVal,bold)=><tr style={{background:'#F7F8FB'}}>

function CashBook({st,persist,month,co,me,companies,markets}){

      <Kpi label="Doanh thu" value={rev?fmt(rev,ccy):'—'} icon="💰" tag="accrual" sub={ratio!=null?('Tỷ lệ LN/DT '+pct(ratio)):'—'}/></div>

/* ===== TỒN KHO ===== */
function Stock({st,month,co,companies}){
  const ccy=CCY[co.marketId],cur=stockValue(st,co.id,co.marketId,month);
  const pm=prevMonth(month),prev=pm?stockValue(st,co.id,co.marketId,pm):null;
  const all=companies.map(c=>{const s=stockValue(st,c.id,c.marketId,month);
    return {c,val:s?s.total:0,valV:(s?s.total:0)*rateFor(st,c.marketId,month),has:!!s};});
  const tot=all.reduce((a,b)=>a+b.valV,0),d=cur&&prev?cur.total-prev.total:null;
  return <div>
    <div className="grid kpis" style={{marginBottom:16}}>
      <Kpi label="Tồn cuối kỳ" value={cur?fmt(cur.total,ccy):'—'} tag="stock" sub={co.name}/>
      <Kpi label="Tồn đầu kỳ" value={prev?fmt(prev.total,ccy):'—'} sub={pm?'Từ '+pm.replace('-','/'):'—'}/>

    <div className="card" style={{marginBottom:16}}><div className="hd"><h3>Chi tiết tồn · {co.name}</h3><span className="tag stock">Tồn kho</span></div>
      {cur?<><table><thead><tr><th>SKU</th><th>Sản phẩm</th><th className="r">SL</th><th className="r">Giá vốn</th><th className="r">Giá trị</th></tr></thead>
        <tbody>{cur.items.map(i=><tr key={i.sku}><td><b>{i.sku}</b></td>
        <td>{i.name}
          {i.isCombo&&<span className="pill" style={{background:'#F1E9FD',color:'var(--stock)',marginLeft:6}}>combo</span>}
          {i.viaCombo>0&&<span className="pill" style={{background:'var(--posbg)',color:'var(--pos)',marginLeft:6}}>+{nf.format(i.viaCombo)} từ combo</span>}

        <td className="r num">{nf.format(i.qty)}</td><td className="r num">{fmt(i.cost,ccy)}</td><td className="r num">{fmt(i.val,ccy)}</td></tr>)}
        <tr className="total"><td colSpan={2}>TỔNG</td><td className="r num">{nf.format(cur.items.reduce((a,b)=>a+b.qty,0))}</td><td></td><td className="r num">{fmt(cur.total,ccy)}</td></tr></tbody></table>

/* ===== CÔNG NỢ ===== */
function Debt({st,persist,month,companies,me}){
  const [sel,setSel]=useState(companies[0]?companies[0].id:null);
  const co=companies.find(c=>c.id===sel)||companies[0];
  if(!co)return <div className="card"><div className="empty"><b>Chưa có công ty nào để xem</b>Nhờ admin phân thị trường hoặc thêm công ty ở Cấu hình.</div></div>;
  const key=co.id+'|'+month,e=st.entries[key],ccy=CCY[co.marketId];
  const upd=m=>{const n=JSON.parse(JSON.stringify(st));const sb=snapshot(st,co.id,month);
    if(!n.entries[key])n.entries[key]=blankEntry(n,co);m(n.entries[key]);
    const imp=diffSnap(sb,snapshot(n,co.id,month));
    const last=(n.logs||[])[0];
    const same=last&&last.action==='Nhập tay'&&last.bucket===BUCKET.debt&&last.coId===co.id&&last.month===month
      &&(Date.now()-new Date(last.at).getTime())<600000;
    if(same){last.at=new Date().toISOString();last.times=(last.times||1)+1;
      last.impact=mergeImpact(last.impact,imp);}
    else addLog(n,{user:me.username||me.name,userName:me.name,action:'Nhập tay',bucket:BUCKET.debt,
      label:'Công nợ',co:co.name,coId:co.id,month,rows:0,amount:0,ccy,times:1,impact:imp,note:'sửa công nợ / tiền sàn'});
    persist(n);};
  const rows=companies.map(c=>{const x=st.entries[c.id+'|'+month];if(!x)return null;const r=rateFor(st,c.marketId,month);
    const rc=(x.receivables||[]).reduce((s,y)=>s+closeDebt(y),0),pa=(x.payables||[]).reduce((s,y)=>s+closeDebt(y),0);
    return {c,ccy:CCY[c.marketId],rc,pa,rcV:rc*r,paV:pa*r,plV:(x.platformEnd||0)*r};}).filter(Boolean);
  const t=rows.reduce((a,r)=>({rc:a.rc+r.rcV,pa:a.pa+r.paV,pl:a.pl+r.plV}),{rc:0,pa:0,pl:0});
  const T=(title,k,hint)=><div className="card" style={{marginBottom:16}}><div className="hd"><h3>{title}</h3>
    <span className="muted" style={{fontSize:11,marginLeft:'auto'}}>{hint}</span></div>
    <table><thead><tr><th>Đối tượng</th><th className="r">Đầu kỳ</th><th className="r">Tăng</th><th className="r">Giảm</th><th className="r">Cuối kỳ</th><th></th></tr></thead>
    <tbody>{((e&&e[k])||[]).map(r=><tr key={r.id}>
      <td><input className="inp txt" value={r.party} onChange={ev=>upd(x=>{x[k]=x[k].map(y=>y.id===r.id?{...y,party:ev.target.value}:y);})}/></td>
      <td><Money value={r.opening} onChange={v=>upd(x=>{x[k]=x[k].map(y=>y.id===r.id?{...y,opening:v}:y);})}/></td>
      <td><Money value={r.increase} onChange={v=>upd(x=>{x[k]=x[k].map(y=>y.id===r.id?{...y,increase:v}:y);})}/></td>
      <td><Money value={r.decrease} onChange={v=>upd(x=>{x[k]=x[k].map(y=>y.id===r.id?{...y,decrease:v}:y);})}/></td>
      <td className="r num">{fmt(closeDebt(r),ccy)}</td>
      <td><button className="iconbtn" onClick={()=>upd(x=>{x[k]=x[k].filter(y=>y.id!==r.id);})}>✕</button></td></tr>)}</tbody></table>
    <div className="bd"><button className="btn sm" onClick={()=>upd(x=>{x[k]=x[k]||[];x[k].push({id:uid(),party:'Đối tượng mới',opening:0,increase:0,decrease:0});})}>+ Thêm đối tượng</button></div></div>;
  return <div>
    <div className="grid kpis" style={{marginBottom:16}}>
      <Kpi label="Phải thu khách" value={fmtVND(t.rc)} tone="warn"/>
      <Kpi label="Tiền sàn chưa đối soát" value={fmtVND(t.pl)} tone="warn" sub="Tự tính từ file Finance"/>
      <Kpi label="Phải trả NCC" value={fmtVND(t.pa)}/>
      <Kpi label="Công nợ ròng" value={fmtVND(t.rc+t.pl-t.pa)} tone={(t.rc+t.pl-t.pa)>=0?'warn':'pos'}/></div>
    <div className="card" style={{marginBottom:16}}><div className="hd"><h3>Tổng hợp các công ty</h3></div>
      <table><thead><tr><th>Công ty</th><th className="r">Phải thu</th><th className="r">Tiền sàn</th><th className="r">Phải trả</th><th className="r">Ròng (VND)</th></tr></thead>
      <tbody>{rows.map(r=><tr key={r.c.id}><td>{r.c.name}</td><td className="r num">{fmt(r.rc,r.ccy)}</td>
        <td className="r num">{fmtVND(r.plV)}</td><td className="r num">{fmt(r.pa,r.ccy)}</td>
        <td className="r num">{fmtVND(r.rcV+r.plV-r.paV)}</td></tr>)}</tbody></table></div>
    <div className="card" style={{marginBottom:16}}><div className="hd"><h3>Chi tiết theo công ty</h3>
      <select value={sel} onChange={ev=>setSel(ev.target.value)} style={{marginLeft:'auto',padding:'7px 9px',border:'1px solid var(--line)',borderRadius:8}}>
        {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
      <div className="bd">
        <FieldRow label="Tiền sàn chưa đối soát — đầu kỳ" value={e?e.platformBegin:0} onChange={v=>upd(x=>x.platformBegin=v)}/>
        <FieldRow label="Tiền sàn chưa đối soát — cuối kỳ" value={e?e.platformEnd:0} onChange={v=>upd(x=>x.platformEnd=v)}
          hint="Tự tính khi tải file Finance, sửa tay được"/></div></div>
    {T('Công nợ phải thu — '+co.name,'receivables','Khách buôn, đại lý')}
    {T('Công nợ phải trả — '+co.name,'payables','NCC, nền tảng ads')}
  </div>;
}

  if(!p||!p.hasData)return <div className="card"><div className="empty"><b>Chưa có số bên hoạt động kinh doanh</b>Tải file đơn hàng ở <b>Tải file dữ liệu</b>.</div></div>;

        <tr className="total"><td>CHÊNH LỆCH cần giải thích</td><td className="r num">{fmt(R.gap,ccy)}</td><td></td></tr>
        <tr className="group"><td colSpan={3}>Các nguyên nhân đã đo được</td></tr>

/* ===== TỔNG QUAN ===== */
function chStats(st,companies,month,chFilter){
  const out={};let net=0,cogs=0,fee=0,listRev=0,qty=0;
  companies.forEach(co=>{const e=st.entries[co.id+'|'+month];if(!e)return;
    const r=rateFor(st,co.marketId,month);
    const LR=compListRev(st,e,co.marketId);
    Object.keys(e.revenue||{}).forEach(ch=>{
      if(chFilter&&ch!==chFilter)return;
      const rv=e.revenue[ch];const nv=(rv.gross||0)-(rv.refund||0);
      if(!nv&&!(LR.byCh[ch]||{}).qty)return;
      const cg=(e.cogsCh&&e.cogsCh[ch]!==undefined)?e.cogsCh[ch]
        :Object.keys((e.variants||{})[ch]||{}).reduce((a,k)=>{const v=e.variants[ch][k];
          const pid=resolveSku(st,ch,v,k);return a+(pid?v.qty*costOf(st,pid,co.marketId):0);},0);
      const fe=Object.values((e.feeCh||{})[ch]||{}).reduce((a,b)=>a+b,0);
      const lr=(LR.byCh[ch]||{}).list||0;const q=(LR.byCh[ch]||{}).qty||0;
      out[ch]=out[ch]||{net:0,cogs:0,fee:0,list:0,qty:0,orders:0};
      out[ch].net+=nv*r;out[ch].cogs+=cg*r;out[ch].fee+=fe*r;out[ch].list+=lr*r;out[ch].qty+=q;
      out[ch].orders+=(e.orderCount&&e.orderCount[ch])||0;
      net+=nv*r;cogs+=cg*r;fee+=fe*r;listRev+=lr*r;qty+=q;});});
  return {byCh:out,net,cogs,fee,listRev,qty};}

  const ids=cos.map(c=>c.id);
  const A=aggregate(st,ids,month);
  const CS=chStats(st,cos,month,fCh);
  const chList=[...new Set(companies.flatMap(c=>{const e=st.entries[c.id+'|'+month];
    return e?Object.keys(e.revenue||{}).filter(ch=>(e.revenue[ch].gross||0)):[];}))];
  const chName=id=>{const c=st.channels.find(x=>x.id===id);return c?c.name:id;};

function blankEntry(st,co){const ccy=CCY[co.marketId],rev={},opex={};

function AuditLog({st,me,companies}){
  const [busyF,setBusyF]=useState('');const [openImp,setOpenImp]=useState({});
  const dl=async f=>{setBusyF(f.id);
    const b64=await loadFileBlob(f.id);setBusyF('');
    if(!b64){alert('Không tìm thấy bản gốc của file này trên máy. Có thể dữ liệu đã bị xoá hoặc tải từ máy khác.');return;}
    const ext=(f.name.split('.').pop()||'xlsx').toLowerCase();
    const type=ext==='csv'?'text/csv':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    download(b64ToBlob(b64,type),f.name);};
  const [fU,setFU]=useState('');const [fB,setFB]=useState('');const [fM,setFM]=useState('');const [fC,setFC]=useState('');
  const canSee=me.role==='admin';
  let logs=(st.logs||[]).filter(l=>canSee||l.user===(me.username||me.name));
  const ids=companies.map(c=>c.id);
  logs=logs.filter(l=>!l.coId||ids.includes(l.coId));
  const users=[...new Set(logs.map(l=>l.user))],buckets=[...new Set(logs.map(l=>l.bucket))],
    months=[...new Set(logs.map(l=>l.month))].sort().reverse(),cos=[...new Set(logs.map(l=>l.co))];
  const view=logs.filter(l=>(!fU||l.user===fU)&&(!fB||l.bucket===fB)&&(!fM||l.month===fM)&&(!fC||l.co===fC));
  const dt=x=>{const d=new Date(x);const z=n=>String(n).padStart(2,'0');
    return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());};
  const exp=()=>{const rows=[['NHẬT KÝ TẢI DỮ LIỆU — GC BCKD'],['Xuất lúc',dt(Date.now())],[],
    ['Thời điểm','Người thực hiện','Họ tên','Thao tác','Đưa vào phần','Nội dung','Kênh','Công ty','Kỳ','Số dòng','Tiền tệ','Tên file','Ghi chú']];
    view.forEach(l=>{rows.push([dt(l.at),l.user,l.userName||'',l.action,l.bucket,l.label||'',l.channel||'',l.co||'',
      l.month||'',l.rows||0,l.ccy||'',l.files||'',(l.note||'')+(l.times>1?(' · sửa '+l.times+' lần'):'')]);

    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:16},{wch:12},{wch:18},{wch:12},{wch:26},{wch:26},{wch:10},{wch:14},{wch:9},{wch:9},{wch:7},{wch:40},{wch:46}];

  return <div>

            {(l.fileRefs&&l.fileRefs.length)

        :<div className="empty"><b>Chưa có thao tác nào</b>Mỗi lần tải file hoặc nhập tay sẽ được ghi lại ở đây.</div>}
      <div className="bd"><div className="noteline">Nhật ký ghi <b>ai</b> tải file gì, vào <b>phần nào</b>, cho <b>công ty và kỳ nào</b>, ra <b>bao nhiêu tiền</b>.
        Bấm <b>Tải file gốc</b> để lấy đúng file kế toán đã đưa lên mà đối chiếu.

        <b> "⬇ Bản trích dữ liệu web đọc được"</b> ở màn Tải file để lưu lại đúng phần web đã đọc. Bản có máy chủ sẽ lưu được mọi file.</div></div></div>

function Guide({st,me}){
  const [open,setOpen]=useState('b1');
  const T=({id,n,title,time,children})=>{const on=open===id;
    return <div className="card" style={{marginBottom:12}}>
      <div className="hd" style={{cursor:'pointer'}} onClick={()=>setOpen(on?'':id)}>

        <h3>{title}</h3>
        {time&&<span className="pill" style={{background:'#EEF0F5',color:'var(--tx2)'}}>{time}</span>}
        <span style={{marginLeft:'auto',color:'var(--tx3)'}}>{on?'▲':'▼'}</span></div>
      {on&&<div className="bd">{children}</div>}</div>;};
  const Step=({k,children})=><div style={{display:'flex',gap:10,marginBottom:10}}>
    <div style={{minWidth:22,height:22,borderRadius:'50%',background:'#EEF0F5',color:'var(--tx2)',
      display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{k}</div>
    <div style={{flex:1,fontSize:13.5}}>{children}</div></div>;
  return <div>
    <div className="card" style={{marginBottom:16,borderColor:'var(--accrual)'}}><div className="bd">
      <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>Web này làm gì?</div>
      <div style={{fontSize:13.5,marginBottom:10}}>Tính lợi nhuận của từng công ty theo <b>hai cách độc lập nhau</b>, rồi so hai con số để tìm chỗ sai lệch:</div>
      <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div style={{padding:'12px 14px',border:'1px solid var(--line)',borderRadius:10,borderLeft:'3px solid var(--accrual)'}}>
          <b style={{fontSize:13}}>Bên hoạt động kinh doanh</b>
          <div style={{fontSize:12.5,color:'var(--tx2)',marginTop:4}}>Lấy từ file anh tải lên: doanh thu, giá vốn, phí sàn, chi phí. Đây là lãi <b>trên sổ sách</b>.</div></div>
        <div style={{padding:'12px 14px',border:'1px solid var(--line)',borderRadius:10,borderLeft:'3px solid var(--cash)'}}>

      <div className="noteline" style={{marginTop:12}}>Hai bên <b>không lấy số của nhau</b>. Đó là chủ ý — có độc lập thì mới đối chiếu được.</div>
    </div></div>

    <div style={{fontSize:14,fontWeight:700,margin:'18px 0 10px'}}>Việc làm hằng tháng — theo đúng thứ tự này</div>

    <T id="b1" n="1" title="Chọn đúng kỳ và công ty" time="10 giây">
      <Step k="a">Góc trên bên phải chọn <b>tháng và năm</b> cần làm. Chọn sai kỳ là số vào nhầm tháng.</Step>
      <Step k="b">Chọn <b>công ty</b> đang làm. Mỗi công ty nhập riêng.</Step>
      <div className="noteline warn">Kế toán chỉ thấy công ty thuộc thị trường mình phụ trách. Không thấy công ty cần làm thì báo admin.</div></T>

    <T id="b2" n="2" title="Tải file đơn hàng của các kênh bán" time="5-10 phút">
      <Step k="a">Vào <b>Tải file dữ liệu</b>, kéo thả file vào ô lớn. Thả nhiều file cùng lúc cũng được.</Step>
      <Step k="b">Web tự nhận: đơn hàng TikTok Shop, đơn hàng Shopee, bán sỉ, bán lẻ cửa hàng. File lạ thì web hỏi <b>"Đây là file gì?"</b> — chọn giúp nó.</Step>
      <Step k="c">Xem bảng kết quả: số đơn, doanh thu, giá vốn. <b>Đối chiếu nhanh với báo cáo trên sàn</b> xem có khớp không.</Step>
      <Step k="d">Bấm <b>Áp dụng vào kỳ</b>.</Step>
      <div className="noteline warn"><b>Bắt buộc tải file đơn hàng TRƯỚC file Finance.</b> Web cần danh sách mã đơn của tháng để lọc chi phí. Thả cùng lúc thì web tự xếp thứ tự.</div>
      <div className="noteline">Nếu file chứa nhiều tháng, web tự lọc lấy đúng kỳ đang chọn và báo đã loại bao nhiêu dòng.</div></T>

    <T id="b3" n="3" title="Tải file đối soát (Finance) của sàn" time="2-5 phút">
      <Step k="a">Thả file Finance của TikTok Shop và Shopee vào cùng chỗ.</Step>
      <Step k="b">Web chỉ lấy phí của <b>những đơn đặt trong tháng đang chọn</b>, bỏ đơn tháng khác lẫn trong file.</Step>
      <Step k="c">Kiểm tra dòng <b>"Danh sách ID đơn lấy từ"</b> — phải có, nếu báo đỏ là chưa tải file đơn hàng.</Step>
      <div className="noteline">File Finance thường rất nặng (5-40 MB), đọc mất 1-3 phút. Đừng tắt trang giữa chừng.</div>
      <div className="noteline warn">File trên 3 MB web không lưu được bản gốc. Với các file này, bấm <b>"⬇ Bản trích dữ liệu web đọc được"</b> và lưu vào thư mục chung để sau này đối soát.</div></T>

    <T id="b4" n="4" title="Ghép SKU sàn với sản phẩm (chỉ làm lần đầu)" time="lần đầu 30 phút, sau đó vài phút">
      <Step k="a">Vào <b>Ghép SKU sàn</b>. Mỗi dòng là một phân loại hàng trên sàn.</Step>
      <Step k="b">Cột cuối gõ tên hoặc mã để tìm sản phẩm của công ty, chọn đúng mã.</Step>
      <Step k="c">Sàn bán combo mà danh mục chỉ có hàng lẻ: bấm <b>"＋ Tạo combo từ dòng này"</b>, chọn 2 sản phẩm con, web tự cộng giá vốn.</Step>
      <div className="noteline ok"><b>Ghép một lần là xong.</b> Tháng sau tải file lên tự nhận, kể cả khi đổi tên listing trên sàn. Chỉ hàng mới thật sự mới phải ghép.</div>
      <div className="noteline warn">Còn dòng chưa ghép thì giá vốn thiếu, lợi nhuận sẽ <b>cao hơn thực tế</b>. Báo cáo KQKD có cảnh báo tỉ lệ đã ghép.</div></T>

    <T id="b5" n="5" title="Tải file chi phí doanh nghiệp" time="5 phút">
      <Step k="a">File chi phí cần tối thiểu 2 cột: <b>tên khoản chi</b> và <b>số tiền</b>. Có thêm cột đồng tiền và diễn giải càng tốt.</Step>
      <Step k="b">Thả file lên, web hỏi loại file thì chọn <b>Chi phí doanh nghiệp</b>, rồi chỉ đúng cột.</Step>
      <Step k="c">Tên khoản chi chưa khớp danh mục thì vào <b>Cấu hình → Ghép tên chi phí</b> gán một lần, sau đó tải lại file.</Step>
      <div className="noteline">Không nhập phí sàn ở đây — phí sàn đã lấy tự động từ file Finance, nhập thêm là tính hai lần.</div></T>

    <T id="b6" n="6" title="Tải file tồn kho cuối tháng" time="2 phút">
      <Step k="a">File tồn cần cột <b>mã sản phẩm</b> và <b>số lượng tồn</b>. Có cột giá vốn thì web định giá luôn.</Step>
      <Step k="b">Web hiện các mã chưa có trong danh mục và <b>đề xuất thêm vào Cấu hình → Sản phẩm</b> — cứ để tick sẵn rồi áp dụng.</Step>

    <T id="b7" n="7" title="Nhập sổ dòng tiền" time="10 phút">
      <Step k="a">Vào <b>Sổ dòng tiền</b>, phần 1 điền <b>số dư cuối kỳ</b> từng tài khoản ngân hàng và tiền mặt.</Step>
      <Step k="b">Số dư đầu kỳ tự nối từ cuối kỳ trước, có ổ khoá 🔒. Chỉ bấm mở khi thật sự cần ghi đè.</Step>
      <Step k="c">Phần 2 điền các khoản <b>đã phát sinh nhưng chưa trả</b>: tiền hàng NCC, lương, thuế, ads chưa thanh toán.</Step>
      <Step k="d">Phần 3 điền vốn góp, rút vốn, vay, trả nợ vay trong kỳ.</Step>
      <div className="noteline" style={{borderColor:'var(--cash)'}}>Sổ này <b>không lấy số nào từ bên kinh doanh</b>. Điền theo sao kê ngân hàng và sổ nợ thực tế.</div></T>

    <T id="b8" n="8" title="Nhập công nợ" time="5 phút">
      <Step k="a">Vào <b>Công nợ</b>, chọn công ty, điền phải thu khách buôn và phải trả nhà cung cấp theo từng đối tượng.</Step>
      <Step k="b">Mỗi dòng có đầu kỳ, phát sinh tăng, phát sinh giảm — web tự tính cuối kỳ.</Step>
      <Step k="c">Tiền sàn chưa đối soát web tự tính từ file Finance, sửa tay được nếu cần.</Step></T>

    <T id="b9" n="9" title="Kiểm tra trước khi báo cáo" time="5 phút">
      <Step k="a"><b>Báo cáo KQKD</b>: xem có cảnh báo giá vốn thiếu không.</Step>
      <Step k="b"><b>So 2 lăng kính</b>: xem dòng <b>"còn lại chưa giải thích"</b>. Số này nhỏ là số liệu khớp. Lớn thì thường do thiếu chi phí, chưa cập nhật số dư, hoặc chưa đẩy file tồn kho.</Step>
      <Step k="c"><b>Nhật ký dữ liệu</b>: rà lại đã tải đủ file chưa, có tải nhầm kỳ không.</Step></T>

    <div style={{fontSize:14,fontWeight:700,margin:'22px 0 10px'}}>Những lỗi hay gặp</div>
    <div className="card"><table><thead><tr><th style={{minWidth:220}}>Hiện tượng</th><th>Nguyên nhân &amp; cách xử lý</th></tr></thead><tbody>
      <tr><td>Báo đỏ "Chưa có danh sách đơn hàng của kênh này"</td><td>Chưa tải file đơn hàng của kênh đó trong kỳ. Tải file đơn hàng trước, hoặc thả chung một lượt với file Finance.</td></tr>

    </tbody></table></div>

    <div className="card" style={{marginTop:16}}><div className="hd"><h3>Nguyên tắc bắt buộc nhớ</h3></div><div className="bd">
      <div style={{fontSize:13.5,lineHeight:1.7}}>
        <div>▸ <b>Đơn hàng trước, Finance sau.</b> Sai thứ tự là phí sàn tính cả đơn tháng khác.</div>
        <div>▸ <b>Không nhập tay doanh thu, giá vốn, phí sàn.</b> Tất cả lấy từ file.</div>
        <div>▸ <b>Sổ dòng tiền điền theo sao kê thật</b>, không chép từ bên kinh doanh.</div>
        <div>▸ <b>File trên 3 MB nhớ tải bản trích</b> để sau còn đối soát.</div>
        <div>▸ <b>Mỗi thao tác đều được ghi nhật ký</b> kèm tên người làm.</div>
      </div></div></div>

    <div className="noteline warn" style={{marginTop:16}}>Đây là bản chạy trên trình duyệt: dữ liệu lưu ngay trên máy đang dùng, máy khác không thấy được.
      Mỗi công ty nên thống nhất <b>một máy làm dữ liệu chính</b> cho tới khi chuyển sang bản có máy chủ.</div>
  </div>;}
const Empty=({name,month})=><div className="card"><div className="empty"><b>Chưa có dữ liệu cho {name} — {month.replace('-','/')}</b>
  Vào <b>Tải file dữ liệu</b> để đẩy file lên.</div></div>;
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){try{console.error('App crash:',err,info);}catch(e){}}
  reset(){try{if(window.storage&&window.storage.delete)window.storage.delete('gochek_v5');}catch(e){}
    try{localStorage.removeItem('gochek_v5');}catch(e){}
    try{location.reload();}catch(e){}}
  render(){
    if(this.state.err)return <div style={{maxWidth:680,margin:'56px auto',padding:'28px 30px',fontFamily:'system-ui,sans-serif',background:'#fff',border:'1px solid #eee',borderRadius:14,boxShadow:'0 8px 30px rgba(16,24,40,.08)'}}>
      <h2 style={{margin:'0 0 8px'}}>Ứng dụng gặp lỗi hiển thị</h2>
      <p style={{color:'#475467',marginTop:0}}>Thường do <b>dữ liệu đã lưu từ bản trước bị lệch định dạng</b> sau khi cập nhật. Bấm "Xoá dữ liệu đã lưu &amp; tải lại" là chạy lại bình thường (chỉ mất số đang nhập tạm, không ảnh hưởng file gốc).</p>
      <pre style={{whiteSpace:'pre-wrap',background:'#FEF3F2',color:'#B42318',padding:12,borderRadius:8,fontSize:12,maxHeight:220,overflow:'auto'}}>{String((this.state.err&&this.state.err.stack)||this.state.err)}</pre>
      <div style={{display:'flex',gap:10,marginTop:14}}>
        <button onClick={()=>this.reset()} style={{background:'#4F46E5',color:'#fff',border:'none',padding:'10px 16px',borderRadius:9,fontWeight:600,cursor:'pointer'}}>Xoá dữ liệu đã lưu &amp; tải lại</button>
        <button onClick={()=>location.reload()} style={{background:'#fff',border:'1px solid #ddd',padding:'10px 16px',borderRadius:9,cursor:'pointer'}}>Chỉ tải lại</button></div></div>;
    return this.props.children;}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
